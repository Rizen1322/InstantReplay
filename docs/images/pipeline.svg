<rect x="784" y="132" width="3" height="22" rx="1.5" fill="#5b9dff"/>
<text x="800" y="149" font-size="16" fill="#e9ecef" font-weight="600" text-anchor="start" >Кольца</text>
<text x="800" y="172" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >видео: сжатые кадры</text>
<text x="800" y="191" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >звук: AAC</text>
<text x="800" y="210" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" ></text>
<text x="800" y="229" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >длина повтора</text>
<text x="800" y="248" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >постоянная: старое</text>
<text x="800" y="267" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >уступает место</text>
<text x="800" y="286" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >новому</text>
</g>
<text x="289" y="254" font-size="12" fill="#8a919c" font-weight="400" text-anchor="middle" >лишние кадры</text>
<g ><rect x="24" y="258" width="150" height="64" rx="12" fill="#161a21" stroke="#232832"/>
<rect x="24" y="272" width="3" height="22" rx="1.5" fill="#5b9dff"/>
