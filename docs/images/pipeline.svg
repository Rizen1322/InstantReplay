<text x="420" y="172" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >BGRA в NV12</text>
<text x="420" y="191" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >или P010, на GPU</text>
</g>
