<text x="230" y="172" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >ровно 60 кадр/с</text>
<text x="230" y="191" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >по сетке слотов</text>
</g>
