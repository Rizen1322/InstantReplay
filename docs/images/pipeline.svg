<text x="610" y="172" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >свой процесс</text>
<text x="610" y="191" font-size="12.5" fill="#8a919c" font-weight="400" text-anchor="start" >HEVC, H.264, AV1</text>
