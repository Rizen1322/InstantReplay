<text x="196" y="200" font-size="44" fill="#e9ecef" font-weight="700" text-anchor="middle" >3:00</text>
<text x="196" y="226" font-size="14" fill="#8a919c" font-weight="400" text-anchor="middle" >последних минут</text>
<text x="196" y="246" font-size="14" fill="#8a919c" font-weight="400" text-anchor="middle" >в памяти</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/><circle cx="430" cy="69" r="5" fill="#34d27b"/><text x="448" y="74" font-size="17" fill="#e9ecef" font-weight="600" text-anchor="start" >Пишется по кругу</text><text x="448" y="98" font-size="14" fill="#8a919c" font-weight="400" text-anchor="start" >Новые секунды занимают место самых старых, длина повтора не меняется.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6499999999999999s" dur="0.6s" fill="freeze"/><circle cx="430" cy="149" r="5" fill="#34d27b"/><text x="448" y="154" font-size="17" fill="#e9ecef" font-weight="600" text-anchor="start" >Клип начинается с ключевого кадра</text><text x="448" y="178" font-size="14" fill="#8a919c" font-weight="400" text-anchor="start" >Он бывает каждые 2 секунды, поэтому первая картинка всегда целая.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/><circle cx="430" cy="229" r="5" fill="#34d27b"/><text x="448" y="234" font-size="17" fill="#e9ecef" font-weight="600" text-anchor="start" >До сохранения диск не трогается</text><text x="448" y="258" font-size="14" fill="#8a919c" font-weight="400" text-anchor="start" >Видео есть только в памяти, пока не нажата клавиша сохранения.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3499999999999999s" dur="0.6s" fill="freeze"/><circle cx="430" cy="309" r="5" fill="#34d27b"/><text x="448" y="314" font-size="17" fill="#e9ecef" font-weight="600" text-anchor="start" >Предел памяти известен заранее</text><text x="448" y="338" font-size="14" fill="#8a919c" font-weight="400" text-anchor="start" >3 минуты при 30 Мбит/с занимают до 1,4 ГБ. Память берётся по мере заполнения.</text></g>
</svg>
